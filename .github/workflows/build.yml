name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Build and package
        shell: powershell
        run: ./build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: OBSRdpCam-x64
          path: |
            dist/OBSRdpCam-x64.zip
            dist/OBSRdpCam-x64.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OBSRdpCam-x64

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            OBSRdpCam-x64.zip
            OBSRdpCam-x64.zip.sha256
